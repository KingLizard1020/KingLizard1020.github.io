name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Validate HTML and local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html projects.html about.html 404.html
      - name: Check local links and assets
        run: python3 scripts/check-site.py
